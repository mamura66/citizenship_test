<!doctype html>
<html lang="en">
<head>
<title>Choose a new password · Prepare for Citizenship</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<main class="auth">
  <a class="mark" href="/"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="20" fill="#0FA968"/><path d="M50 15 C60.5 32 68 36.5 68 48.5 C68 60.5 60 68.5 50 68.5 C40 68.5 32 60.5 32 48.5 C32 36.5 39.5 32 50 15 Z" fill="#fff"/><rect x="37" y="70" width="26" height="6.5" rx="3.25" fill="#fff"/><rect x="44" y="78" width="12" height="10" rx="3" fill="#fff" opacity=".85"/></svg> Prepare for Citizenship</a>

  <h1>Choose a new password</h1>
  <p class="lede" id="lede">Checking your link…</p>

  <p class="msg bad" id="msg" hidden></p>

  <form id="form" novalidate hidden>
    <label>New password <span class="hint">At least 10 characters.</span>
      <input type="password" name="password" autocomplete="new-password" required minlength="10">
    </label>
    <label>Type it again
      <input type="password" name="confirm" autocomplete="new-password" required minlength="10">
    </label>
    <button class="primary" type="submit">Save it and sign me in</button>
  </form>

  <div id="expired" hidden>
    <div class="promise">
      <p><b>That link has expired or has already been used.</b> Reset links last one hour
         and work once, for your safety.</p>
    </div>
    <p class="alt"><a href="/forgot">Send me a new link</a></p>
  </div>

  <p class="foot">
    <a href="/terms">Terms</a> · <a href="/privacy-web">Privacy</a> · <a href="/support">Support</a><br>
    Saving a new password signs out anyone else using your account.
  </p>
</main>
<script src="/reset.js"></script>
</body>
</html>
