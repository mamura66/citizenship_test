<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Prepare for Citizenship</title>
<meta name="description" content="Sign in to your Prepare for Citizenship account.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/auth.css">
</head>
<body>
<main class="auth">
  <a class="mark" href="/"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="20" fill="#0FA968"/><path d="M50 15 C60.5 32 68 36.5 68 48.5 C68 60.5 60 68.5 50 68.5 C40 68.5 32 60.5 32 48.5 C32 36.5 39.5 32 50 15 Z" fill="#fff"/><rect x="37" y="70" width="26" height="6.5" rx="3.25" fill="#fff"/><rect x="44" y="78" width="12" height="10" rx="3" fill="#fff" opacity=".85"/></svg> Prepare for Citizenship</a>

  <h1>Sign in</h1>
  <p class="lede">Your progress, your practice tests and your access are on your account.</p>

  <p class="msg bad" id="msg" hidden></p>

  <form id="form" novalidate>
    <label>Email
      <input type="email" name="email" autocomplete="email" required autocapitalize="none" spellcheck="false">
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
      <a class="hint-link" href="/forgot">Forgotten your password?</a>
    </label>
    <button class="primary" type="submit">Sign in</button>
  </form>

  <div id="googleBlock" hidden>
    <div class="or">or</div>
    <a class="google" id="google" href="/api/auth/google/start"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Continue with Google</a>
  </div>

  <p class="alt">New here? <a href="/signup">Create an account</a></p>

  <p class="foot">
    <a href="/terms">Terms</a> · <a href="/privacy-web">Privacy</a> · <a href="/support">Support</a><br>
    We store your email, your study progress and whether you have full access. Nothing else.
  </p>
</main>
<script src="/auth.js"></script>
</body>
</html>
